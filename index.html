<!DOCTYPE html>
<html>
<head>
<title>Pharmacy Knowledge 247</title>

<style>
body{
font-family: Arial;
background:#0f172a;
color:white;
padding:20px;
}

header{
background:#16a34a;
padding:20px;
border-radius:10px;
text-align:center;
}

a{
color:#38bdf8;
text-decoration:none;
}

.box{
background:#1e293b;
padding:15px;
margin-top:20px;
border-radius:10px;
}

input{
padding:10px;
width:70%;
border-radius:8px;
border:none;
}

button{
padding:10px;
background:#16a34a;
color:white;
border:none;
border-radius:8px;
}

</style>
</head>

<body>

<header>
<h1>Pharmacy Knowledge 247</h1>
<p>Learn Medicines in Easy Hindi</p>
</header>


<div class="box">

<h2>Search Pharmacy Topics</h2>

<input type="text" id="searchBox" placeholder="Search medicine or disease">

<button onclick="searchPage()">Search</button>

</div>


<div class="box">

<h2>Explore</h2>

<p><a href="medicines.html">Medicines</a></p>

<p><a href="diseases.html">Diseases</a></p>

<p><a href="pharmacology.html">Pharmacology</a></p>

</div>


<div class="box">

<h2>About</h2>

<p>
Welcome to Pharmacy Knowledge 247.
Here you will learn about medicines, diseases, pharmacology and pharmacy in simple Hindi language.
</p>

</div>


<script>

function searchPage(){

let query = document.getElementById("searchBox").value.toLowerCase();


if(query.includes("paracetamol")){
window.location.href="paracetamol.html";
}

else if(query.includes("ibuprofen")){
window.location.href="ibuprofen.html";
}

else if(query.includes("amoxicillin")){
window.location.href="amoxicillin.html";
}

else if(query.includes("diabetes") || query.includes("hypertension")){
window.location.href="diseases.html";
}

else if(query.includes("antibiotic")){
window.location.href="pharmacology.html";
}

else{
alert("Topic nahi mila. Jaldi hi add kiya jayega.");
}

}

</script>


</body>
</html>
